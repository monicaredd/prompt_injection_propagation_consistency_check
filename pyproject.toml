[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "monicaredd-prompt_injection_propagation_consistency_check"
version = "0.1.0"
description = "在同一个输入里两两比对，检测工具调用协议工程师·提示注入的跨轮传播相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "monicaredd" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://monicaredd.github.io"
Repository = "https://github.com/monicaredd/prompt_injection_propagation_consistency_check"
Issues = "https://github.com/monicaredd/prompt_injection_propagation_consistency_check/issues"

[project.scripts]
prompt_injection_propagation_consistency_check = "prompt_injection_propagation_consistency_check:main"

[tool.setuptools]
py-modules = ["prompt_injection_propagation_consistency_check"]
